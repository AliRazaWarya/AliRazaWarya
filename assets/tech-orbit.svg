<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ali Raza's orbiting tech stack">
  <defs>
    <linearGradient id="or-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0B1020" rx="18"/>

  <!-- Rotating dashed rings -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="4 10">
    <ellipse cx="600" cy="180" rx="470" ry="120">
      <animateTransform attributeName="transform" type="rotate" from="0 600 180" to="360 600 180" dur="60s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-dasharray="4 10">
    <ellipse cx="600" cy="180" rx="330" ry="90">
      <animateTransform attributeName="transform" type="rotate" from="360 600 180" to="0 600 180" dur="45s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Center core -->
  <g>
    <rect x="470" y="140" width="260" height="80" rx="18" fill="#111827" stroke="url(#or-line)" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold" fill="#F1F5F9">FULL STACK</text>
    <text x="600" y="202" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#22D3EE" letter-spacing="3">DEVELOPER</text>
  </g>

  <!-- Orbiting tech labels -->
  <g font-family="'Fira Code', monospace" font-size="21" font-weight="bold" text-anchor="middle">
    <text fill="#22D3EE"><animateMotion dur="18s" repeatCount="indefinite" path="M 600 180 m -470 0 a 470 120 0 1 0 940 0 a 470 120 0 1 0 -940 0"/>Python</text>
    <text fill="#A78BFA"><animateMotion dur="18s" begin="-4.5s" repeatCount="indefinite" path="M 600 180 m -470 0 a 470 120 0 1 0 940 0 a 470 120 0 1 0 -940 0"/>SQL</text>
    <text fill="#22D3EE"><animateMotion dur="18s" begin="-9s" repeatCount="indefinite" path="M 600 180 m -470 0 a 470 120 0 1 0 940 0 a 470 120 0 1 0 -940 0"/>Flask</text>
    <text fill="#A78BFA"><animateMotion dur="18s" begin="-13.5s" repeatCount="indefinite" path="M 600 180 m -470 0 a 470 120 0 1 0 940 0 a 470 120 0 1 0 -940 0"/>PHP</text>
    <text fill="#22D3EE"><animateMotion dur="14s" repeatCount="indefinite" path="M 600 180 m -330 0 a 330 90 0 1 0 660 0 a 330 90 0 1 0 -660 0"/>MySQL</text>
    <text fill="#A78BFA"><animateMotion dur="14s" begin="-3.5s" repeatCount="indefinite" path="M 600 180 m -330 0 a 330 90 0 1 0 660 0 a 330 90 0 1 0 -660 0"/>JavaScript</text>
    <text fill="#22D3EE"><animateMotion dur="14s" begin="-7s" repeatCount="indefinite" path="M 600 180 m -330 0 a 330 90 0 1 0 660 0 a 330 90 0 1 0 -660 0"/>Power BI</text>
    <text fill="#A78BFA"><animateMotion dur="14s" begin="-10.5s" repeatCount="indefinite" path="M 600 180 m -330 0 a 330 90 0 1 0 660 0 a 330 90 0 1 0 -660 0"/>Selenium</text>
  </g>
</svg>
