<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ali Raza's GitHub journey">
  <defs>
    <linearGradient id="jn-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="jn-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0B1020" rx="18"/>
  <rect width="1200" height="300" fill="url(#jn-grid)" rx="18"/>

  <!-- Animated timeline line -->
  <line x1="110" y1="150" x2="1090" y2="150" stroke="url(#jn-line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Nodes with staggered pulses -->
  <g>
    <circle cx="130" cy="150" r="13" fill="#22D3EE"><animate attributeName="r" values="13;18;13" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="150" r="13" fill="#A78BFA"><animate attributeName="r" values="13;18;13" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="150" r="13" fill="#22D3EE"><animate attributeName="r" values="13;18;13" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="13" fill="#A78BFA"><animate attributeName="r" values="13;18;13" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="150" r="13" fill="#22D3EE"><animate attributeName="r" values="13;18;13" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="130" y="105" font-size="23" font-weight="bold" fill="#22D3EE">2022</text>
    <text x="130" y="200" font-size="18" fill="#F1F5F9">GitHub journey</text>
    <text x="130" y="226" font-size="18" fill="#94A3B8">started</text>

    <text x="370" y="105" font-size="23" font-weight="bold" fill="#A78BFA">12</text>
    <text x="370" y="200" font-size="18" fill="#F1F5F9">Public repositories</text>
    <text x="370" y="226" font-size="18" fill="#94A3B8">and counting</text>

    <text x="610" y="105" font-size="23" font-weight="bold" fill="#22D3EE">2025–26</text>
    <text x="610" y="200" font-size="18" fill="#F1F5F9">AI/ML Intern</text>
    <text x="610" y="226" font-size="18" fill="#94A3B8">@ IAXON</text>

    <text x="850" y="105" font-size="23" font-weight="bold" fill="#A78BFA">2026</text>
    <text x="850" y="200" font-size="18" fill="#F1F5F9">BS Computer Science</text>
    <text x="850" y="226" font-size="18" fill="#94A3B8">Virtual University</text>

    <text x="1070" y="105" font-size="23" font-weight="bold" fill="#22D3EE">Now</text>
    <text x="1070" y="200" font-size="18" fill="#F1F5F9">Full Stack Developer</text>
    <text x="1070" y="226" font-size="18" fill="#94A3B8">open to remote roles</text>
  </g>
</svg>
